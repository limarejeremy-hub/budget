name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Préparer la signature de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=release.jks"
            } > android/key.properties
            echo "Signature de release configurée (keystore dédié)."
          else
            echo "Aucun secret de signature configuré — build signé avec la clé debug."
          fi

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Générer le code Drift
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyser le projet
        run: flutter analyze

      - name: Lancer les tests
        run: flutter test

      - name: Compiler l'APK release
        run: flutter build apk --release

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: budgetpilot-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
