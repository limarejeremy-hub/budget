plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "0.1.0"

// Signature de release : si android/key.properties existe (créé localement par
// un développeur, ou généré en CI à partir de secrets GitHub — jamais commité,
// voir .gitignore), on l'utilise pour signer les builds release avec une clé
// stable. Sinon on retombe sur la clé debug, pour que le projet compile même
// sans configuration de signature (mais alors la signature change à chaque
// nouvelle installation du SDK/CI, cf. docs/DATA_PERSISTENCE.md).
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.budgetpilot.app"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Requis par flutter_local_notifications pour les notifications
        // planifiées (rappels V0.9), compatible avec les anciennes
        // versions d'Android.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.budgetpilot.app"
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Signature stable (même clé à chaque build) si android/key.properties
            // est présent ; sinon repli sur la clé debug pour que le projet
            // compile toujours (mais la signature n'est alors PAS garantie stable
            // d'un build à l'autre — cf. docs/DATA_PERSISTENCE.md).
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Requis par flutter_local_notifications (notifications planifiées).
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
